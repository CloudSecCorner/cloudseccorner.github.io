apiVersion: v1
kind: Namespace
metadata:
  name: cloudseccorner-production
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-app
  namespace: cloudseccorner-production
  labels:
    app.kubernetes.io/name: workload-app
    app.kubernetes.io/part-of: cnapp-architecture
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workload-app
  template:
    metadata:
      labels:
        app: workload-app
    spec:
      # KSPM Rule 1: Prevent automatic token projection (mitigates MITRE T1078 / T1552)
      automountServiceAccountToken: false
      securityContext:
        # KSPM Rule 2: Enforce non-root execution (mitigates MITRE T1068)
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        # KSPM Rule 3: Restrict system calls via runtime default seccomp profile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: cgr.dev/chainguard/nginx:latest
          ports:
            - containerPort: 8080
          securityContext:
            # KSPM Rule 4: Disable privilege escalation
            allowPrivilegeEscalation: false
            # KSPM Rule 5: Read-only root filesystem prevents dropping implants (MITRE T1059)
            readOnlyRootFilesystem: true
            # KSPM Rule 6: Drop all Linux capabilities
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: workload-app
  namespace: cloudseccorner-production
spec:
  type: ClusterIP
  selector:
    app: workload-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# CNI Microsegmentation: Default Deny All Ingress and Egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: cloudseccorner-production
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# CNI Microsegmentation: Ingress only allowed from Ingress Controller / ALB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-alb
  namespace: cloudseccorner-production
spec:
  podSelector:
    matchLabels:
      app: workload-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-controller
      ports:
        - protocol: TCP
          port: 8080
---
# CNI Microsegmentation: Egress strictly whitelisted to internal AWS Secrets & DB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-egress-controlled
  namespace: cloudseccorner-production
spec:
  podSelector:
    matchLabels:
      app: workload-app
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
