name: Phoenix CI

on:
  pull_request:
    paths:
      - "phoenix/**"
      - "scripts/validate-content.mjs"
      - "public/data/**"
      - "src/data/security-entries.js"
      - ".github/workflows/phoenix.yml"
  push:
    branches:
      - main
    paths:
      - "phoenix/**"
      - "scripts/validate-content.mjs"
      - "public/data/**"
      - "src/data/security-entries.js"
      - ".github/workflows/phoenix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phoenix-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: phoenix

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.3"

      - name: Install Hex
        run: mix local.hex --force

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            phoenix/deps
            phoenix/_build
          key: phoenix-${{ runner.os }}-otp-29-elixir-1.20.3-${{ hashFiles('phoenix/mix.exs', 'phoenix/mix.lock') }}
          restore-keys: |
            phoenix-${{ runner.os }}-otp-29-elixir-1.20.3-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run Phoenix tests
        run: mix test

      - name: Validate migrated site content
        working-directory: .
        run: node scripts/validate-content.mjs
