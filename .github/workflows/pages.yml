name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Erlang & Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.3'
          otp-version: '29'

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            phoenix/_build
            phoenix/deps
            node_modules
          key: pages-v1-${{ runner.os }}-${{ hashFiles('phoenix/mix.lock', 'package-lock.json') }}
          restore-keys: |
            pages-v1-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate content
        run: node scripts/validate-content.mjs

      - name: Install Hex & Rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Fetch Elixir dependencies
        working-directory: phoenix
        run: mix deps.get

      - name: Compile Elixir dependencies
        working-directory: phoenix
        run: mix deps.compile

      - name: Run Elixir tests
        working-directory: phoenix
        run: mix test

      - name: Export static site via Elixir
        working-directory: phoenix
        run: mix site.export --output ../_site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
