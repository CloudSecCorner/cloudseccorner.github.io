name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Erlang & Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4.1'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install React dependencies
        run: npm ci

      - name: Install lab test prerequisites
        run: sudo apt-get update && sudo apt-get install -y nmap openssl

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            _build
            deps
          key: pages-v1-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            pages-v1-${{ runner.os }}-

      - name: Install Hex & Rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Fetch Elixir dependencies
        run: mix deps.get

      - name: Compile Elixir dependencies
        run: mix deps.compile

      - name: Refresh cloud security feeds with Elixir
        run: mix feeds.refresh

      - name: Run Elixir tests
        run: mix test

      - name: Sync tool database & README tables
        run: python3 scripts/update_readme_tools.py

      - name: Test and build React UI
        run: npm run check

      - name: Export Elixir pages with React UI
        run: mix site.export --require-frontend --output _site

      - name: Verify combined Pages artifact
        run: npm run test:export

      - name: Save validated daily feed snapshot
        if: github.event_name == 'schedule'
        run: |
          git add priv/data/cloud-security-feed.json public/data/cloud-security-feed.json priv/static/data/cloud-security-feed.json public/feeds/cloud-security.xml public/feeds/cloud-security.opml priv/static/feeds/cloud-security.xml priv/static/feeds/cloud-security.opml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'content: refresh daily cloud security feed [skip ci]'
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
